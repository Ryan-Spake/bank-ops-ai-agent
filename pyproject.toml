[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bankops"
version = "0.1.0"
description = "Auditable AI agent that explains bank operational metrics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Runtime deps grow step by step: each roadmap PR adds what it imports.
dependencies = [
    # Step 1: ingestion
    "requests>=2.31",
    "pyyaml>=6.0",
    # Step 2: warehouse
    "duckdb>=1.0",
    "dbt-duckdb>=1.9",
    # Step 4: RAG
    "chromadb>=1.0",
    "fastembed>=0.3",   # embeddings + cross-encoder reranker (ONNX, no torch)
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6", "pre-commit>=3.7"]
snowflake = ["dbt-snowflake>=1.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dbt"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
